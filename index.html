<script>
const $=id=>document.getElementById(id);
if(typeof CanvasRenderingContext2D!=="undefined"&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
let eshown=0;function showErr(e){if(eshown++>2)return;const d=document.createElement("div");d.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:#7a1f2e;color:#fff;padding:8px 10px;border-radius:8px;font-size:12px";d.textContent="오류: "+(e&&e.message||e);document.body.appendChild(d)}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=t=>String(t/60|0).padStart(2,"0")+":"+String(t%60).padStart(2,"0");

 // Minimal accessory, small enough to preserve each pet's silhouette.

// V10: readable miniature adventurer silhouettes drawn over the sprite body.
// No changes to player hitboxes, movement, stats or pet identities.
function v10Costume(c,id,phase,walking){
 const palettes=[['#537c88','#c5e8e4'],['#ad6388','#ffd0e0'],['#6b7cb3','#d4d9fa'],['#4c8d7b','#b4e8c9'],['#ad744d','#f7c59b'],['#7965a4','#d5b6f1'],['#936f59','#f2d7b7'],['#64839a','#d3e6f2'],['#6b9674','#d5e9bd'],['#a17dbe','#e4d4ff'],['#568da5','#b7eafa']];
 const [base,trim]=palettes[id%palettes.length];const walk=walking?Math.sin(phase)*2.6:0;
 c.save();c.lineJoin='round';c.lineCap='round';

 c.fillStyle='#292536';c.strokeStyle='#1b1b29';c.lineWidth=1.5;

 for(let side of [-1,1]){c.save();c.translate(side*6,13);c.rotate(side*walk*.045);

 // sleeves and gauntlets
 for(let side of [-1,1]){c.save();c.scale(side,1);c.fillStyle=base;

 c.fillStyle='#4b3b46';c.beginPath();c.roundRect(12,7,5,5,1.5);c.fill();c.restore()}
 // crossed cloth, layered collar and stitched seam
 c.fillStyle=trim;c.globalAlpha=.65;c.beginPath();c.moveTo(-7,-7);c.lineTo(0,2);c.lineTo(6,-7);c.lineTo(3,-9);c.lineTo(0,-3);c.lineTo(-3,-9);c.closePath();c.fill();c.globalAlpha=1;
 c.strokeStyle='rgba(255,255,255,.32)';c.lineWidth=1;c.beginPath();c.moveTo(-8,-2);c.lineTo(-7,10);c.moveTo(8,-2);c.lineTo(7,10);c.stroke();
 // dark leather belt, clasp and diagonal utility strap
 c.strokeStyle='#4b3740';c.lineWidth=3.4;c.beginPath();c.moveTo(-9,10);c.lineTo(9,10);c.stroke();
 c.strokeStyle='rgba(238,209,161,.75)';c.lineWidth=1.5;c.beginPath();c.moveTo(-6,-5);c.lineTo(5,10);c.stroke();
 c.fillStyle='#f3d49a';c.beginPath();c.roundRect(-2,8,4,4,1);c.fill();
 // class emblem
 c.fillStyle=trim;c.beginPath();c.moveTo(0,0);c.lineTo(2,3);c.lineTo(0,6);c.lineTo(-2,3);c.closePath();c.fill();
 c.restore();
}

function pushRank(){if(!ACC)return;clearTimeout(rkTm);rkTm=setTimeout(()=>{if(!RKDB||!ACC)return;try{const id=rid();let tot=ACC.tot||0,time=Math.round(ACC.time||0);
 for(const r of RK){if(r.id===id||(r.id[0]==="u"&&r.name===ACC.name)){tot=Math.max(tot,r.tot||0);time=Math.max(time,r.time||0);if(r.id!==id)RKDB.doc(r.id).delete().catch(()=>{})}}
 if(tot>(ACC.tot||0))ACC.tot=tot;if(time>(ACC.time||0))ACC.time=time;ACC.uid=id;
 try{localStorage.setItem("msacc",JSON.stringify(DBM))}catch(e){}
 RKDB.doc(id).set({name:ACC.name,tot,time,ts:Date.now()}).catch(()=>{})}catch(e){}},1200)}
function rkRows(){if(RKLIVE)return RK;return Object.values(DBM).map(a=>({id:a.uid,name:a.name,tot:a.tot||0,time:Math.round(a.time||0)}))}
const fmtT=t=>{t=Math.round(t);const h=t/3600|0,m=(t%3600)/60|0;return h?h+"시간 "+m+"분":m?m+"분 "+(t%60)+"초":t+"초"};
function rkBox(n){return "<div class=rk data-n="+n+"></div>"}
function rkPaint(){document.querySelectorAll(".rk").forEach(el=>{const n=+el.dataset.n||10,k=rkTab?"tot":"time",me=ACC&&rid();const rows=rkRows().filter(r=>(r[k]||0)>0).sort((a,b)=>(b[k]||0)-(a[k]||0)).slice(0,n);
 el.innerHTML="<div class=rkh><b>🏆 랭킹 "+(RKLIVE?"<span class=live>● 실시간</span>":"")+"</b><button class='rkt"+(rkTab?"":" on")+"' data-t=0>⏱ 누적시간</button><button class='rkt"+(rkTab?" on":"")+"' data-t=1>🧠 문제풀이</button></div>"+(rows.length?rows.map((r,i)=>"<div class='rkr"+(me&&r.id===me?" me":"")+"'><i>"+(["🥇","🥈","🥉"][i]||i+1)+"</i><span>"+esc(r.name||"?")+"</span><em>"+(rkTab?(r.tot||0)+"문제":fmtT(r.time))+"</em></div>").join(""):"<p class=rkn>아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</p>")+(RKLIVE?"":"<p class=rkn>이 기기의 계정만 표시돼요. 전체 랭킹은 공유 주소에서 열어야 보여요.</p>")})}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest(".rkt");if(t){rkTab=+t.dataset.t;rkPaint()}});
(async()=>{try{if(window.claude&&claude.use){const db=await claude.use("db");if(db){RKDB=db.collection("rank");let first=true;RKDB.onSnapshot(sn=>{RK=sn.docs.map(d=>Object.assign({id:d.id},d.data()));RKLIVE=true;rkPaint();if(first){first=false;if(ACC)pushRank()}},()=>{RKLIVE=false;rkPaint()})}}}catch(e){}})();
ldb();login();
let last=performance.now();
function loop(n){try{const dt=Math.min(.05,(n-last)/1000);last=n;if(G.st==="play"&&HS>0){HS-=dt}else if(G.st==="play"){if(ACC){ACC.time=(ACC.time||0)+dt;tkAcc+=dt;if(tkAcc>10){tkAcc=0;sdb()}}let r=SPD;while(r>1e-6&&G.st==="play"){const q=Math.min(r,1);upd(dt*q);r-=q}}draw();$("ex").style.display=$("sp").style.display=G.st==="play"?"":"none"}catch(err){showErr(err)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
